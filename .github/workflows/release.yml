name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build:
    name: build (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p mdhtml

      - name: Package archive and checksum
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$NAME" = "windows-x64" ]; then
            binary="target/${TARGET}/release/mdhtml.exe"
            flat="mdhtml.exe"
          else
            binary="target/${TARGET}/release/mdhtml"
            flat="mdhtml"
          fi
          archive="mdhtml-${VERSION}-${NAME}.tar.gz"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp "$binary" "$staging/$flat"
          tar -C "$staging" -czf "$archive" "$flat"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            mdhtml-${{ needs.release-please.outputs.version }}-${{ matrix.name }}.*
