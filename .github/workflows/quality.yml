name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gate needs the merge base

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Runtime check (fixtures .md -> expected HTML)
        run: node runtime/build.mjs check

      - name: Runtime tests
        run: node --test runtime/test/*.test.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --workspace

      - name: Example build/check/round-trip
        run: ./scripts/check-examples.sh

      - name: Install Sentrux
        env:
          SENTRUX_VERSION: v0.5.7
        run: |
          mkdir -p "$HOME/.sentrux/bin"
          curl -fsSL "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64" \
            -o "$HOME/.sentrux/bin/sentrux"
          chmod +x "$HOME/.sentrux/bin/sentrux"
          echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

      - name: Sentrux check (absolute rules)
        run: sentrux check .

      - name: Sentrux gate (no regression)
        run: sentrux gate .

      - name: E2E (deterministic, file://)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Release binary size limit (max 3 MiB, see ADR 0019)
        run: |
          cargo build --locked --release -p mdhtml
          size="$(wc -c < target/release/mdhtml)"
          echo "mdhtml release binary: ${size} bytes"
          if [ "$size" -gt 3145728 ]; then
            echo "mdhtml release binary exceeds the 3 MiB (3145728 bytes) limit" >&2
            exit 1
          fi
