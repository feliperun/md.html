name: quality

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gate needs the merge base

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Runtime check (fixtures .md -> expected HTML)
        run: node runtime/build.mjs check

      - name: Runtime tests
        run: node --test runtime/test/*.test.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --workspace

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      - name: Bounded fuzz targets
        run: |
          set -euo pipefail
          rm -rf .runs/fuzz-project
          mkdir -p .runs/fuzz-project .runs/fuzz-artifacts .runs/cargo-target .runs/crates
          cp fuzz/Cargo.toml fuzz/Cargo.lock .runs/fuzz-project/
          cp -R fuzz/src fuzz/fuzz_targets .runs/fuzz-project/
          ln -sfn "$PWD/crates/mdhtml" .runs/crates/mdhtml
          ln -sfn "$PWD/runtime" .runs/runtime
          ln -sfn "$PWD/themes" .runs/themes
          ln -sfn "$PWD/fonts" .runs/fonts
          for spec in fuzz_parser:parser fuzz_html_validator:html-validator fuzz_css_validator:css-validator fuzz_extract_roundtrip:extract-roundtrip fuzz_build_audit:build-audit; do
            target=${spec%%:*}
            seed=${spec##*:}
            mkdir -p ".runs/fuzz-project/corpus/$seed" ".runs/fuzz-artifacts/$seed"
            cp -R "fuzz/seeds/$seed/." ".runs/fuzz-project/corpus/$seed/"
            cargo +nightly fuzz run --fuzz-dir .runs/fuzz-project --target-dir .runs/cargo-target "$target" -- -runs=256 -max_total_time=20 -artifact_prefix="$PWD/.runs/fuzz-artifacts/$seed/"
          done
          test -z "$(git status --porcelain --untracked-files=all -- fuzz/seeds)"

      - name: Example build/check/round-trip
        run: ./scripts/check-examples.sh

      - name: Install Sentrux
        env:
          SENTRUX_VERSION: v0.5.7
        run: |
          mkdir -p "$HOME/.sentrux/bin"
          curl -fsSL "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/sentrux-linux-x86_64" \
            -o "$HOME/.sentrux/bin/sentrux"
          chmod +x "$HOME/.sentrux/bin/sentrux"
          echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

      - name: Sentrux check (absolute rules)
        run: sentrux check .

      - name: Sentrux gate (no regression)
        run: sentrux gate .

      - name: E2E (deterministic, file://)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Release binary size limit (max 3 MiB, see ADR 0019)
        run: |
          cargo build --locked --release -p mdhtml
          size="$(wc -c < target/release/mdhtml)"
          echo "mdhtml release binary: ${size} bytes"
          if [ "$size" -gt 3145728 ]; then
            echo "mdhtml release binary exceeds the 3 MiB (3145728 bytes) limit" >&2
            exit 1
          fi
